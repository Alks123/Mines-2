
name: Build Minha Foto

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Extrair projeto
        run: unzip -q minha_foto_projeto_fabric.zip -d projeto

      - name: Compilar mod
        working-directory: projeto
        run: gradle build

      - name: Disponibilizar mod
        uses: actions/upload-artifact@v4
        with:
          name: minha_foto-mod
          path: projeto/build/libs/*.jar
          
